{{- if include "mcp-server.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secretEnv }}
  {{ $key }}: {{ include "mcp-server.scalar" $value | quote }}
  {{- end }}
  {{- if .Values.mcp.bearerToken.value }}
  MCP_HTTP_BEARER_TOKEN: {{ .Values.mcp.bearerToken.value | quote }}
  {{- end }}
{{- end }}
