{{- if .Values.httpRoute.enabled }}
{{- if not .Values.httpRoute.parentRefs }}
{{- fail "httpRoute.parentRefs is required when httpRoute.enabled=true" }}
{{- end }}
{{- $fullname := include "mcp-server.fullname" . }}
{{- $port := .Values.service.port }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- /* Every rule field is kept except backendRefs, which always points at this chart's Service. */}}
    {{- $default := dict "matches" (list (dict "path" (dict "type" "PathPrefix" "value" "/"))) }}
    {{- $backendRefs := list (dict "name" $fullname "port" $port) }}
    {{- range (.Values.httpRoute.rules | default (list $default)) }}
    - {{ set (omit . "backendRefs") "backendRefs" $backendRefs | toYaml | indent 6 | trim }}
    {{- end }}
{{- end }}
