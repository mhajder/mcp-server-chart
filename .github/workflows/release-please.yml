name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  # Never cancel a running publish: the tag would exist without a pushed chart.
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['charts/mcp-server--release_created'] }}
      tag_name: ${{ steps.release.outputs['charts/mcp-server--tag_name'] }}
      version: ${{ steps.release.outputs['charts/mcp-server--version'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # Keyless cosign signature and build provenance attestation
      attestations: write # Required to store the build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          # Full history and tags, to list the commits since the previous release
          fetch-depth: 0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # Artifact Hub shows this annotation as the version's changelog. It is
      # built from the same commits release-please uses (conventional commits
      # touching the chart since the previous tag) and only added to the
      # packaged chart, not committed.
      - name: Add the changelog to Chart.yaml for Artifact Hub
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || true)
          range=${prev:+$prev..}$TAG
          pattern='^([a-z]+)(\([^)]*\))?(!)?: (.+)$'
          echo '[]' > changes.yaml
          while IFS=$'\x1f' read -r sha subject; do
            [[ $subject =~ $pattern ]] || continue
            type=${BASH_REMATCH[1]} breaking=${BASH_REMATCH[3]} desc=${BASH_REMATCH[4]}
            if [ -n "$breaking" ] || grep -q '^BREAKING[ -]CHANGE:' <<< "$(git log -1 --format=%B "$sha")"; then
              kind=changed
            else
              case $type in
                feat) kind=added ;;
                fix) kind=fixed ;;
                perf|refactor|docs) kind=changed ;;
                *) continue ;; # chore, ci, build, test: not visible to chart users
              esac
            fi
            KIND=$kind DESC=$desc NAME="Commit ${sha:0:7}" URL="$COMMIT_URL/$sha" \
              yq -i '. += [{"kind": strenv(KIND), "description": strenv(DESC), "links": [{"name": strenv(NAME), "url": strenv(URL)}]}]' changes.yaml < /dev/null
          done < <(git log --no-merges --format='%H%x1f%s' "$range" -- charts/mcp-server)
          if [ "$(yq 'length' changes.yaml)" -eq 0 ]; then
            echo "::warning::No user-facing commits in $range; skipping artifacthub.io/changes"
            exit 0
          fi
          CHANGES=$(cat changes.yaml) yq -i '.annotations."artifacthub.io/changes" = strenv(CHANGES)' charts/mcp-server/Chart.yaml

      - name: Package chart
        id: package
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          helm package charts/mcp-server --destination dist
          # OCI references must be lowercase
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Push chart to GHCR
        id: push
        env:
          OWNER: ${{ steps.package.outputs.owner }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          # cosign and actions/attest read the Docker credentials, not Helm's
          echo "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          status=0
          out=$(helm push dist/mcp-server-*.tgz "oci://ghcr.io/${OWNER}/charts" 2>&1) || status=$?
          echo "$out"
          [ "$status" -eq 0 ] || exit "$status"
          digest=$(awk '/^Digest:/ {print $2}' <<< "$out")
          if [ -z "$digest" ]; then
            echo "::error::No digest in the helm push output"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${OWNER}/charts/mcp-server@$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless signature with the workflow's GitHub identity. Artifact Hub shows
      # it as "Signed"; check it with `cosign verify` (see README).
      - name: Sign the chart with cosign
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: cosign sign --yes "$REF"

      - name: Attest chart build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.package.outputs.owner }}/charts/mcp-server
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records are only supported for organization-owned repositories
          create-storage-record: false

      - name: Add install instructions to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
          OWNER: ${{ steps.package.outputs.owner }}
        run: |
          # shellcheck disable=SC2016 # backticks are Markdown, not command substitution
          {
            gh release view "$TAG" --json body --jq .body
            printf '
          ## ⎈ Helm Chart

          | Chart | Version |
          |-------|---------|
          | `oci://ghcr.io/%s/charts/mcp-server` | `%s` |

          ```sh
          curl -fsSLO https://raw.githubusercontent.com/%s/%s/examples/librenms-mcp.yaml
          helm upgrade --install librenms-mcp oci://ghcr.io/%s/charts/mcp-server \\
            --version %s -f librenms-mcp.yaml
          ```

          Values files for every server: [`examples/`](https://github.com/%s/tree/%s/examples)
          ' "$OWNER" "$VERSION" "$GH_REPO" "$TAG" "$OWNER" "$VERSION" "$GH_REPO" "$TAG"
          } > release_notes.md
          gh release edit "$TAG" --notes-file release_notes.md
          gh release upload "$TAG" dist/mcp-server-*.tgz --clobber
