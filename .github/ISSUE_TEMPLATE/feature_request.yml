name: Feature request
description: Suggest a new chart option or a new server example
labels: ["enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Type of request
      options:
        - New chart option or template
        - New server example in examples/
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What do you want to deploy or configure that the chart cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: For a new option, show the values you would like to write and the resource it should render.
      render: yaml
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Reference
      description: Link to the Kubernetes docs, the MCP server repository or another chart that does this, if you have one.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
