# glpi-mcp
# Install:
#   helm upgrade --install glpi-mcp oci://ghcr.io/mhajder/charts/mcp-server \
#     -n mcp --create-namespace -f examples/glpi-mcp.yaml
#
# Create the credentials Secret first:
#   kubectl -n mcp create secret generic glpi-mcp-credentials \
#     --from-literal=GLPI_CLIENT_ID='...' \
#     --from-literal=GLPI_CLIENT_SECRET='...' \
#     --from-literal=GLPI_PASSWORD='...' \
#     --from-literal=MCP_HTTP_BEARER_TOKEN='...'

image:
  repository: ghcr.io/mhajder/glpi-mcp
  # "latest" is rebuilt on every push to main (unreleased code).
  # Pin a release (e.g. "1.2.3") for production.
  tag: latest
  # Required with a moving tag, otherwise nodes keep the cached image.
  pullPolicy: Always

env:
  GLPI_URL: "https://glpi.example.com"
  GLPI_USERNAME: "glpi-mcp"
  GLPI_API_VERSION: "auto"
  GLPI_VERIFY_SSL: "true"
  GLPI_TIMEOUT: "30"
  READ_ONLY_MODE: "true"
  LOG_LEVEL: "INFO"

existingSecret: glpi-mcp-credentials

# Expose outside the cluster with Gateway API (or use ingress: instead):
# httpRoute:
#   enabled: true
#   parentRefs:
#     - name: shared-gateway
#       namespace: gateway-system
#   hostnames:
#     - glpi-mcp.example.com
